name: Neotics kit
on:
  workflow_dispatch:
  push:
    paths:
      - 'neotics/**'
      - '.github/workflows/neotics.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglu1-mesa && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e . pytest
      - name: Test
        run: python -m pytest -q -s -o addopts="" neotics/tests
